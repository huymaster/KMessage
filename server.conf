limit_req_zone $binary_remote_addr zone=limit:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name server-huymaster.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name server-huymaster.ddns.net;

    client_max_body_size 16M;

    ssl_certificate     /etc/letsencrypt/live/server-huymaster.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server-huymaster.ddns.net/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;

    location / {
        limit_req zone=limit burst=50 nodelay;

        proxy_pass         http://app:8080;
        proxy_http_version 1.1;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_hide_header X-Powered-By;
        proxy_read_timeout 86400;
    }

    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;

        proxy_pass http://minio:9000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 0;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}